[workspace]
members = [".", "hodeco-contract", "hodeco-codec"]
default-members = [".", "hodeco-contract"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[package]
name = "hodeco"
version.workspace = true
edition = "2024"
license.workspace = true

[dependencies]
hodeco-contract = { path = "hodeco-contract", features = ["server-defaults"] }
axum = { version = "0.8", features = ["ws"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
futures-util = "0.3"
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["server-auto", "service", "tokio"] }
parking_lot = "0.12"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10" # replace with yaml-rust2 = { version = "2.0", features = ["serde"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-serial = "5"
tokio-util = { version = "0.7", features = ["rt"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["compression-gzip", "fs", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
http-body-util = "0.1"
proptest = "1"
tempfile = "3"
tokio-tungstenite = "0.28"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_System_Services",
    "Win32_System_Registry",
    "Win32_System_EventLog",
    "Win32_System_SystemInformation",
    "Win32_Security",
    "Win32_Foundation"
] }


