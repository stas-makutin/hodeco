[workspace]
members = ["."]
default-members = ["."]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
hodeco-codec = { path = "../hodeco-codec" }
hodeco-contract = { path = "../hodeco-contract" }
hodeco-schedule = { path = "../hodeco-schedule" }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std", "wasmbind"] }
chrono-tz = "0.10"
egui = "0.37"
egui_extras = { version = "0.37", default-features = false, features = ["serde"] }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11", "clipboard"] }
ewebsock = { version = "0.8", features = ["tls"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
web-time = "1"

[package]
name = "hodeco-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "egui admin and diagnostics frontend for the hodeco gateway"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hodeco-codec.workspace = true
hodeco-contract.workspace = true
hodeco-schedule.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
egui.workspace = true
egui_extras = { workspace = true, features = ["datepicker"] }
jiff = "0.2"
ewebsock.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
url.workspace = true
uuid.workspace = true
web-time.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe.workspace = true
env_logger = "0.11"

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe.workspace = true
uuid = { workspace = true, features = ["js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "HtmlCanvasElement",
    "HtmlDocument",
    "HtmlElement",
    "HtmlTextAreaElement",
    "KeyboardEvent",
    "Location",
    "Node",
    "Window",
    "Response",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"

[profile.dev.package."*"]
opt-level = 1
