# cargo-deny configuration.
#
#   cargo deny check licenses
#
# hodeco-ui is a separate workspace; check it as well:
#
#   cargo deny --manifest-path hodeco-ui/Cargo.toml check licenses
#
# Reference: https://embarkstudios.github.io/cargo-deny/

[graph]
# An empty list means every target is checked, not only the host, so that
# Linux-only and WASM-only dependencies are covered too.
targets = []
all-features = false
no-default-features = false

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "0BSD",
    "CC0-1.0",
    "MIT-0",
    "Unlicense",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    # serialport (via tokio-serial) is file-level copyleft only: modifications
    # to its files must stay MPL-2.0, the rest of hodeco is unaffected.
    "MPL-2.0",
    # egui's bundled default fonts.
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
confidence-threshold = 0.93
# This config is shared by two workspaces, so each one sees some allowances as
# unused. `cargo deny check licenses` is run against both.
unused-allowed-license = "allow"

[bans]
# Duplicate versions are expected in this tree; this check is about licenses.
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
